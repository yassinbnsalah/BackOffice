<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
  data-sidebar-position="fixed" data-header-position="fixed">
  <div class="body-wrapper">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <div class="card">
            <div class="card-body p-4">
              <h5 class="card-title fw-bold mb-4 text-center">Foyer Liste</h5>
              <div class="row mb-3">
                <div class="col-auto">
                  <input type="text" [(ngModel)]="search" (input)="onSearch()" class="form-control" placeholder="Search by Name">
                </div>
              </div>
              <div class="table-responsive">
                <div class="d-flex justify-content-end mb-3" *ngIf="role!='ADMIN'">
                  <a (click)="GoToAddFoyer()" routerLinkActive="active" class="btn btn-primary">Add Foyer</a>
                </div>
                <app-addfoyer *ngIf="showAddFoyer==true" (addFoyer)="onFoyerAdded($event)"></app-addfoyer>
                <table class="table table-bordered text-center align-middle">
                  <thead class="bg-primary text-light">
                    <tr>
                      <th scope="col">Nom Foyer</th>
                      <th scope="col">Adresse</th>
                      <th scope="col">Capacité Foyer</th>
                      <th scope="col">Created At</th>
                      <th scope="col">Updated At</th>
                      <th scope="col">Details</th>
                    </tr>
                  </thead>
                  <tbody *ngFor="let foyer of paginatedData">
                    <tr >
                      <td>{{foyer.nomFoyer}}</td>
                      <td>{{foyer.adresse}}</td>
                      <td>{{foyer.capaciteFoyer}}</td>
                      <td>{{ foyer.createdAt | date:'yy-MM-dd' }}</td>
                      <td>{{foyer.updatedAt | date:'yy-MM-dd'}}</td>
                      <td>
                        <a (click)="GoToFoyerDetail(foyer.idFoyer)" routerLinkActive="active" class="btn btn-primary btn-sm">See Details</a>
            
                      </td>
                    </tr>
                  </tbody>
                </table>
                <div class="row" *ngIf="totalItems > pageSize">
                  <div class="col-sm-12">
                    <mat-paginator [length]="totalItems"
                                   [pageSize]="pageSize"
                                   [pageSizeOptions]="pageSizeOptions"
                                   (page)="getPageData($event)"
                                   showFirstLastButtons>
                    </mat-paginator>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
